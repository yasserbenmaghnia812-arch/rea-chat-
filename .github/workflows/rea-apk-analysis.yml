name: REA APK Analysis
on:
  workflow_dispatch:
    inputs:
      apk_path:
        description: "Authorized APK path under targets/"
        required: true
        type: string
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Print REA CLI help
        shell: bash
        run: |
          mkdir -p out
          npx -y rea-agents@latest --help 2>&1 | tee out/help.txt
      - name: Run Android APK inspection only when advertised by help
        shell: bash
        env:
          APK_PATH: ${{ inputs.apk_path }}
        run: |
          set -euo pipefail
          [[ "$APK_PATH" == targets/*.apk && -f "$APK_PATH" ]] || { echo "APK path must point to an existing APK inside targets/" | tee out/error.txt; exit 1; }
          HELP="$(cat out/help.txt)"
          COMMAND="$(printf '%s\n' "$HELP" | grep -Eo 'inspect-android-package|analyze-android-package|inspect-android-apk|analyze-android-apk' | head -n1 || true)"
          if [[ -z "$COMMAND" ]]; then
            echo "No Android APK command is listed in rea-agents --help. Inspect help.txt; no guessed command was run." | tee out/error.txt
            exit 2
          fi
          echo "$COMMAND" | tee out/command.txt
          npx -y rea-agents@latest "$COMMAND" "$APK_PATH" --json > out/package.json
          node -e "JSON.parse(require('fs').readFileSync('out/package.json','utf8'))"
      - name: Upload results even after a failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rea-results
          path: out/
          if-no-files-found: warn
          retention-days: 14
