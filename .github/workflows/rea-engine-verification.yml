name: Android Build + Real REA APK Analysis

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Build REA Chat APK
        run: gradle assembleDebug

      - name: Install REA CLI
        run: npm install --global rea-agents@latest

      - name: Download and verify pinned JADX engine
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rea"
          cd "$RUNNER_TEMP/rea"
          curl -fL --retry 3 -o jadx-headless-mcp-0.7.1-all.jar \
            https://github.com/1013503897/jadx-headless-mcp/releases/download/v0.7.1/jadx-headless-mcp-0.7.1-all.jar
          echo "6e5eacf500b64292bfb73c49797c1958f6ee44646e43e868039ae7feb573ff75  jadx-headless-mcp-0.7.1-all.jar" | sha256sum --check
          echo "REA_JADX_MCP_JAR=$RUNNER_TEMP/rea/jadx-headless-mcp-0.7.1-all.jar" >> "$GITHUB_ENV"

      - name: Run real REA analysis on the APK built in this job
        shell: bash
        run: |
          set -euo pipefail
          rea inspect-android-package "$GITHUB_WORKSPACE/app/build/outputs/apk/debug/app-debug.apk" --json | tee "$RUNNER_TEMP/rea-analysis.json"
          test -s "$RUNNER_TEMP/rea-analysis.json"

      - name: Upload APK and REA evidence
        uses: actions/upload-artifact@v4
        with:
          name: rea-chat-apk-and-analysis
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            ${{ runner.temp }}/rea-analysis.json
          if-no-files-found: error
          retention-days: 7
