name: REA Analysis Job

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: Short-lived signed URL for the uploaded APK
        required: true
        type: string
      task_id:
        description: Supabase analysis task UUID
        required: true
        type: string
      project_id:
        description: Supabase project UUID
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: rea-analysis-${{ inputs.task_id }}
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mask temporary signed URL
        env:
          APK_URL: ${{ inputs.apk_url }}
        run: echo "::add-mask::$APK_URL"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"

      - name: Download APK
        env:
          APK_URL: ${{ inputs.apk_url }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rea"
          curl --fail --location --retry 3 --max-time 180 "$APK_URL" -o "$RUNNER_TEMP/rea/input.apk"
          test -s "$RUNNER_TEMP/rea/input.apk"
          file "$RUNNER_TEMP/rea/input.apk"
          unzip -t "$RUNNER_TEMP/rea/input.apk" >/dev/null

      - name: Install official REA CLI
        run: npm install --global rea-agents@6.8.0

      - name: Download and verify JADX headless bridge
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/rea"
          curl --fail --location --retry 3 -o jadx-headless-mcp-0.7.1-all.jar             https://github.com/1013503897/jadx-headless-mcp/releases/download/v0.7.1/jadx-headless-mcp-0.7.1-all.jar
          echo "6e5eacf500b64292bfb73c49797c1958f6ee44646e43e868039ae7feb573ff75  jadx-headless-mcp-0.7.1-all.jar" | sha256sum --check
          echo "REA_JADX_MCP_JAR=$RUNNER_TEMP/rea/jadx-headless-mcp-0.7.1-all.jar" >> "$GITHUB_ENV"

      - name: Run real REA Android package analysis
        shell: bash
        run: |
          set -euo pipefail
          rea inspect-android-package "$RUNNER_TEMP/rea/input.apk" --json > "$RUNNER_TEMP/rea/evidence.json"
          test -s "$RUNNER_TEMP/rea/evidence.json"

      - name: Upload analysis evidence
        uses: actions/upload-artifact@v4
        with:
          name: rea-evidence-${{ inputs.task_id }}
          path: ${{ runner.temp }}/rea/evidence.json
          if-no-files-found: error
          retention-days: 7
