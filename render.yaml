services:
  - type: web
    name: rea-cloud-mcp
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./cloud-mcp/Dockerfile
    dockerContext: ./cloud-mcp
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: MCP_BEARER_TOKEN
        sync: false
      - key: REA_LOG_LEVEL
        value: info
